<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pérégrination — Turn a Renaissance painting into a world you can walk through, and uncover its curiosities as you go."
    />
    <script>
      // World routes have their own boot screen; the doorway preloader is for `/` only.
      ;(function () {
        if (location.pathname.indexOf('/world/') === 0) return
        document.documentElement.classList.add('has-preloader', 'is-preloading')
      })()
    </script>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (media swap) — keeps FCP/LCP free of a render-blocking stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- Hero planes — URLs must match assets.parallax in src/data.ts so the cache is shared -->
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/1-far.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/6-god.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/5-adam.webp?v=2" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/2-clouds.webp?v=2" />
    <title>Pérégrination — Le Voyage des Curiosités</title>
    <style>
      /* Critical preloader styles — inline so the loader paints before the app bundle. */
      html.is-preloading,
      html.is-preloading body {
        overflow: hidden;
      }
      html.is-preloading .hero,
      html.is-preloading .hero * {
        animation-play-state: paused !important;
      }
      html:not(.has-preloader) #preloader {
        display: none;
      }
      @property --hole {
        syntax: '<length>';
        inherits: false;
        initial-value: -80px;
      }
      #preloader {
        --p: 0;
        --sx: 47%;
        --sy: 42%;
        position: fixed;
        inset: 0;
        z-index: 99;
        color: #efe6d6;
        font-family: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      #preloader.is-leaving {
        pointer-events: none;
      }
      .preloader__veil {
        --hole: -80px;
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 60% at var(--sx) var(--sy), rgba(201, 162, 74, 0.1) 0%, rgba(201, 162, 74, 0) 60%),
          radial-gradient(ellipse at var(--sx) var(--sy), #211912 0%, #15120f 55%, #0b0907 100%);
        -webkit-mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
        mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
      }
      .is-leaving .preloader__veil {
        --hole: 160vmax;
        transition:
          --hole 1.3s cubic-bezier(0.76, 0, 0.24, 1),
          opacity 0.5s ease 0.85s;
        opacity: 0;
      }
      .preloader__corner {
        position: absolute;
        width: clamp(2.5rem, 6vw, 4.5rem);
        height: clamp(2.5rem, 6vw, 4.5rem);
        overflow: visible;
      }
      .preloader__corner path {
        fill: none;
        stroke: #c9a24a;
        stroke-width: 1;
        stroke-dasharray: 1;
        stroke-dashoffset: calc(1 - var(--p));
        opacity: 0.8;
      }
      .preloader__corner--tl { top: clamp(0.9rem, 2.4vw, 1.75rem); left: clamp(0.9rem, 2.4vw, 1.75rem); }
      .preloader__corner--tr { top: clamp(0.9rem, 2.4vw, 1.75rem); right: clamp(0.9rem, 2.4vw, 1.75rem); scale: -1 1; }
      .preloader__corner--bl { bottom: clamp(0.9rem, 2.4vw, 1.75rem); left: clamp(0.9rem, 2.4vw, 1.75rem); scale: 1 -1; }
      .preloader__corner--br { bottom: clamp(0.9rem, 2.4vw, 1.75rem); right: clamp(0.9rem, 2.4vw, 1.75rem); scale: -1 -1; }
      /* Two hands of light reach for the spark as the doorway loads */
      .preloader__reach {
        position: absolute;
        top: var(--sy);
        height: 1px;
        transform: scaleX(var(--p));
      }
      .preloader__reach--l {
        left: 0;
        width: calc(var(--sx) - 9px);
        transform-origin: left center;
        background: linear-gradient(90deg, rgba(201, 162, 74, 0), rgba(201, 162, 74, 0.35) 55%, #f3d58f);
      }
      .preloader__reach--r {
        right: 0;
        width: calc(100% - var(--sx) - 9px);
        transform-origin: right center;
        background: linear-gradient(270deg, rgba(201, 162, 74, 0), rgba(201, 162, 74, 0.35) 55%, #f3d58f);
      }
      .preloader__spark {
        position: absolute;
        left: var(--sx);
        top: var(--sy);
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #ffe9b8;
        box-shadow:
          0 0 10px 2px rgba(255, 223, 150, 0.75),
          0 0 44px 10px rgba(224, 98, 58, 0.28);
        scale: calc(0.55 + var(--p) * 0.75);
        animation: preloaderPulse 1.8s ease-in-out infinite;
      }
      .is-complete .preloader__spark {
        animation: preloaderFlare 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .preloader__text {
        position: absolute;
        left: var(--sx);
        top: calc(var(--sy) + clamp(2.25rem, 6vh, 3.5rem));
        translate: -50% 0;
        display: grid;
        justify-items: center;
        gap: 0.55rem;
        width: max-content;
        max-width: 88vw;
        text-align: center;
        transition:
          opacity 0.45s ease,
          translate 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .preloader__kicker {
        margin: 0;
        font-family: 'IM Fell English SC', Georgia, serif;
        font-size: 0.8125rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #c9a24a;
        opacity: 0;
        animation: preloaderRise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      }
      .preloader__title {
        margin: 0;
        font-family: 'IM Fell French Canon', Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.6rem, 3.4vw, 2.4rem);
        line-height: 1;
        color: #f7f1e4;
        opacity: 0;
        animation: preloaderRise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }
      .preloader__title em {
        font-style: italic;
        color: #e8c886;
      }
      .preloader__foot {
        position: absolute;
        left: clamp(1.5rem, 4.5vw, 3.5rem);
        right: clamp(1.5rem, 4.5vw, 3.5rem);
        bottom: clamp(1.5rem, 4.5vw, 3.25rem);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        transition: opacity 0.45s ease;
      }
      .preloader__status {
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(239, 230, 214, 0.55);
      }
      .preloader__count {
        font-size: clamp(2.25rem, 5vw, 3.5rem);
        font-weight: 400;
        line-height: 0.85;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: rgba(247, 241, 228, 0.9);
      }
      .preloader__count::after {
        content: '%';
        margin-left: 0.15em;
        font-size: 0.34em;
        letter-spacing: 0.1em;
        vertical-align: top;
        color: #c9a24a;
      }
      .is-complete .preloader__text {
        opacity: 0;
        translate: -50% -10px;
      }
      .is-complete .preloader__foot,
      .is-complete .preloader__reach {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      /* Gilt edge that rides the iris outward */
      .preloader__ring {
        position: absolute;
        left: var(--sx);
        top: var(--sy);
        width: 320vmax;
        height: 320vmax;
        margin: -160vmax 0 0 -160vmax;
        border-radius: 50%;
        border: 1px solid rgba(243, 213, 143, 0.9);
        box-shadow: 0 0 40px 6px rgba(224, 160, 80, 0.35);
        scale: 0;
        opacity: 0;
        pointer-events: none;
      }
      .is-leaving .preloader__ring {
        scale: 1;
        transition: scale 1.3s cubic-bezier(0.76, 0, 0.24, 1);
        animation: preloaderRing 1.3s linear forwards;
      }
      @keyframes preloaderPulse {
        50% {
          filter: brightness(1.35);
          box-shadow:
            0 0 14px 3px rgba(255, 223, 150, 0.9),
            0 0 60px 16px rgba(224, 98, 58, 0.34);
        }
      }
      @keyframes preloaderFlare {
        40% {
          scale: 3.4;
          filter: brightness(1.6);
        }
        to {
          scale: 1.4;
          filter: brightness(1.2);
        }
      }
      @keyframes preloaderRise {
        from {
          opacity: 0;
          translate: 0 0.5em;
          filter: blur(8px);
        }
        to {
          opacity: 1;
          translate: 0 0;
          filter: blur(0);
        }
      }
      @keyframes preloaderRing {
        0% { opacity: 0; }
        12% { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (max-width: 640px) {
        .preloader__foot {
          flex-direction: row;
        }
        .preloader__status {
          font-size: 0.625rem;
          letter-spacing: 0.16em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader__spark,
        .preloader__kicker,
        .preloader__title {
          animation: none !important;
          opacity: 1;
        }
        .is-leaving .preloader__veil {
          --hole: -80px;
          transition: opacity 0.45s ease;
        }
        .preloader__ring {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Pérégrination">
      <div class="preloader__veil">
        <svg class="preloader__corner preloader__corner--tl" viewBox="0 0 72 72" aria-hidden="true"><path d="M1 71 V1 H71" pathLength="1" /></svg>
        <svg class="preloader__corner preloader__corner--tr" viewBox="0 0 72 72" aria-hidden="true"><path d="M1 71 V1 H71" pathLength="1" /></svg>
        <svg class="preloader__corner preloader__corner--bl" viewBox="0 0 72 72" aria-hidden="true"><path d="M1 71 V1 H71" pathLength="1" /></svg>
        <svg class="preloader__corner preloader__corner--br" viewBox="0 0 72 72" aria-hidden="true"><path d="M1 71 V1 H71" pathLength="1" /></svg>
        <span class="preloader__reach preloader__reach--l" aria-hidden="true"></span>
        <span class="preloader__reach preloader__reach--r" aria-hidden="true"></span>
        <span class="preloader__spark" aria-hidden="true"></span>
        <div class="preloader__text">
          <p class="preloader__kicker">Pérégrination</p>
          <p class="preloader__title">Le Voyage des <em>Curiosités</em></p>
        </div>
        <div class="preloader__foot">
          <span class="preloader__status" data-preloader-status>Stretching the canvas</span>
          <span class="preloader__count" data-preloader-count>00</span>
        </div>
      </div>
      <span class="preloader__ring" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
