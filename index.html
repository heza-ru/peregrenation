<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pérégrination — Turn a Renaissance painting into a world you can walk through, and uncover its curiosities as you go."
    />
    <script>
      // World routes have their own boot screen; the void preloader is for `/` only.
      ;(function () {
        if (location.pathname.indexOf('/world/') === 0) return
        document.documentElement.classList.add('has-preloader', 'is-preloading')
      })()
    </script>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (media swap) — keeps FCP/LCP free of a render-blocking stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- Hero planes — URLs must match assets.parallax in src/data.ts so the cache is shared -->
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/1-far.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/6-god.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/5-adam.webp?v=2" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/2-clouds.webp?v=2" />
    <title>Pérégrination — Le Voyage des Curiosités</title>
    <style>
      /* Critical preloader styles — inline so the loader paints before the app bundle.
         The scene canvas draws the void and the burning porthole underneath (html.gl-void);
         this overlay is only the editorial chrome, plus a CSS stand-in without WebGL. */
      html.is-preloading,
      html.is-preloading body {
        overflow: hidden;
      }
      html.is-preloading .hero,
      html.is-preloading .hero * {
        animation-play-state: paused !important;
      }
      html:not(.has-preloader) #preloader {
        display: none;
      }
      @property --hole {
        syntax: '<length>';
        inherits: false;
        initial-value: -80px;
      }
      #preloader {
        --p: 0;
        --sx: 50%;
        --sy: 42%;
        --edge: clamp(1.25rem, 3.2vw, 2.75rem);
        --gold: #c9a24a;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-io: cubic-bezier(0.76, 0, 0.24, 1);
        position: fixed;
        inset: 0;
        z-index: 99;
        overflow: hidden;
        color: #f2eadb;
        font-family: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      #preloader.is-leaving {
        pointer-events: none;
      }

      /* ——— Backdrop: CSS void until the canvas takes over ——— */
      .preloader__veil {
        --hole: -80px;
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 42% at 32% 30%, rgba(70, 56, 140, 0.28), transparent 70%),
          radial-gradient(ellipse 50% 46% at 72% 66%, rgba(104, 56, 128, 0.22), transparent 70%),
          #030307;
        transition: opacity 0.9s ease;
        -webkit-mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
        mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
      }
      html.gl-void .preloader__veil {
        opacity: 0;
      }
      .is-leaving .preloader__veil {
        --hole: 160vmax;
        opacity: 0;
        transition:
          --hole 1.3s var(--ease-io),
          opacity 0.5s ease 0.85s;
      }
      /* Without WebGL: an ember ring stands in for the burning porthole */
      .preloader__ember {
        position: absolute;
        left: var(--sx);
        top: var(--sy);
        width: calc(4rem + var(--p) * 14rem);
        aspect-ratio: 1;
        translate: -50% -50%;
        border-radius: 50%;
        box-shadow:
          0 0 0 1px rgba(255, 214, 160, 0.9),
          0 0 18px 2px rgba(255, 120, 50, 0.55),
          0 0 60px 10px rgba(255, 110, 40, 0.18),
          inset 0 0 26px 4px rgba(255, 120, 50, 0.35);
      }
      html.gl-void .preloader__ember {
        display: none;
      }

      /* ——— Drafting chrome (Shopify Editions-style hairlines) ——— */
      .preloader__rule {
        position: absolute;
        background: rgba(242, 234, 219, 0.16);
        transition: opacity 0.5s ease;
      }
      .preloader__rule--top,
      .preloader__rule--bottom {
        left: var(--edge);
        right: var(--edge);
        height: 1px;
        transform-origin: left center;
        scale: 0 1;
        animation: preloaderDraw 1.4s var(--ease-io) 0.1s forwards;
      }
      .preloader__rule--top {
        top: calc(var(--edge) + 1.9rem);
      }
      .preloader__rule--bottom {
        bottom: calc(var(--edge) + 1.9rem);
        transform-origin: right center;
      }
      /* Crosshair arms converge on the gap between the fingertips as the load fills */
      .preloader__arm {
        position: absolute;
        background: linear-gradient(var(--dir), rgba(201, 162, 74, 0), rgba(201, 162, 74, 0.55));
      }
      .preloader__arm--l,
      .preloader__arm--r {
        top: var(--sy);
        height: 1px;
        width: calc(var(--sx) - var(--edge) - 7rem);
        scale: var(--p) 1;
      }
      .preloader__arm--l {
        --dir: 90deg;
        left: var(--edge);
        transform-origin: left center;
      }
      .preloader__arm--r {
        --dir: 270deg;
        right: var(--edge);
        transform-origin: right center;
      }
      .preloader__arm--t,
      .preloader__arm--b {
        left: var(--sx);
        width: 1px;
        scale: 1 var(--p);
      }
      .preloader__arm--t {
        --dir: 180deg;
        top: calc(var(--edge) + 1.9rem);
        height: calc(var(--sy) - var(--edge) - 1.9rem - 7rem);
        transform-origin: center top;
      }
      .preloader__arm--b {
        --dir: 0deg;
        bottom: calc(var(--edge) + 1.9rem);
        height: calc(100% - var(--sy) - var(--edge) - 1.9rem - 7rem);
        transform-origin: center bottom;
      }
      .preloader__tick {
        position: absolute;
        left: var(--sx);
        top: var(--sy);
        width: 13rem;
        aspect-ratio: 1;
        translate: -50% -50%;
        border-radius: 50%;
        border: 1px dashed rgba(201, 162, 74, 0.22);
        rotate: calc(var(--p) * 90deg);
        opacity: 0;
        animation: preloaderFade 1.6s ease 0.6s forwards;
      }

      /* ——— Type ——— */
      .preloader__mask {
        display: block;
        overflow: hidden;
        padding-block: 0.1em;
        margin-block: -0.1em;
      }
      .preloader__mask > * {
        display: block;
        translate: 0 110%;
        animation: preloaderLineIn 1.1s var(--ease) var(--d, 0.2s) forwards;
      }
      .is-leaving .preloader__mask > * {
        translate: 0 -110%;
        transition: translate 0.8s var(--ease-io) var(--o, 0s);
        animation: none;
      }
      .preloader__head,
      .preloader__foot {
        position: absolute;
        left: var(--edge);
        right: var(--edge);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      .preloader__head {
        top: var(--edge);
      }
      .preloader__foot {
        bottom: var(--edge);
      }
      .preloader__mark {
        font-family: 'IM Fell English SC', Georgia, serif;
        font-size: 0.95rem;
        letter-spacing: 0.22em;
        color: var(--gold);
      }
      .preloader__label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.625rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(242, 234, 219, 0.58);
      }
      .preloader__label b {
        font-weight: 500;
        color: rgba(242, 234, 219, 0.92);
      }
      .preloader__verse {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--sy) + 8.25rem);
        text-align: center;
        font-family: 'IM Fell French Canon', Georgia, serif;
        font-style: italic;
        font-size: clamp(1.05rem, 1.7vw, 1.35rem);
        color: rgba(242, 234, 219, 0.82);
      }
      .preloader__verse em {
        color: #e8c886;
      }
      /* Big editorial counter */
      .preloader__count {
        position: absolute;
        right: var(--edge);
        bottom: calc(var(--edge) + 2.6rem);
        display: flex;
        align-items: flex-start;
        font-family: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: clamp(4rem, 11vw, 8.5rem);
        line-height: 0.8;
        letter-spacing: -0.055em;
        font-variant-numeric: tabular-nums;
        color: #f7f1e4;
      }
      .preloader__count sup {
        margin: 0.08em 0 0 0.1em;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        color: var(--gold);
      }
      .preloader__bar {
        position: absolute;
        left: var(--edge);
        right: var(--edge);
        bottom: calc(var(--edge) + 1.9rem);
        height: 1px;
        background: linear-gradient(90deg, rgba(201, 162, 74, 0.4), #f3d58f);
        transform-origin: left center;
        scale: var(--p) 1;
        box-shadow: 0 0 10px rgba(243, 213, 143, 0.6);
      }
      .is-complete .preloader__arm,
      .is-complete .preloader__tick,
      .is-complete .preloader__bar,
      .is-complete .preloader__ember {
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .is-leaving .preloader__rule,
      .is-leaving .preloader__count sup {
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      @keyframes preloaderDraw {
        to {
          scale: 1 1;
        }
      }
      @keyframes preloaderFade {
        to {
          opacity: 1;
        }
      }
      @keyframes preloaderLineIn {
        to {
          translate: 0 0;
        }
      }
      @media (max-width: 640px) {
        .preloader__label--hide-sm {
          display: none;
        }
        .preloader__tick {
          width: 10rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader__rule--top,
        .preloader__rule--bottom,
        .preloader__tick,
        .preloader__mask > * {
          animation: none !important;
          scale: 1 1;
          translate: none;
          opacity: 1;
        }
        .is-leaving .preloader__mask > * {
          translate: none;
        }
        .is-leaving .preloader__veil {
          --hole: -80px;
          transition: opacity 0.45s ease;
        }
        #preloader.is-leaving {
          opacity: 0;
          transition: opacity 0.45s ease;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Pérégrination">
      <div class="preloader__veil" aria-hidden="true"></div>
      <span class="preloader__ember" aria-hidden="true"></span>

      <span class="preloader__rule preloader__rule--top" aria-hidden="true"></span>
      <span class="preloader__rule preloader__rule--bottom" aria-hidden="true"></span>
      <span class="preloader__arm preloader__arm--l" aria-hidden="true"></span>
      <span class="preloader__arm preloader__arm--r" aria-hidden="true"></span>
      <span class="preloader__arm preloader__arm--t" aria-hidden="true"></span>
      <span class="preloader__arm preloader__arm--b" aria-hidden="true"></span>
      <span class="preloader__tick" aria-hidden="true"></span>

      <div class="preloader__head">
        <span class="preloader__mask"><span class="preloader__mark" style="--d: 0.15s">Pérégrination</span></span>
        <span class="preloader__mask preloader__label--hide-sm"><span class="preloader__label" style="--d: 0.25s; --o: 0.05s">Le Voyage des Curiosités</span></span>
        <span class="preloader__mask"><span class="preloader__label" style="--d: 0.35s; --o: 0.1s">Ch. <b>00</b> — The Void</span></span>
      </div>

      <p class="preloader__verse">
        <span class="preloader__mask"><span style="--d: 0.55s; --o: 0.05s">Between two hands, <em>a world</em> waits to be lit.</span></span>
      </p>

      <div class="preloader__count" aria-hidden="true">
        <span class="preloader__mask"><span style="--d: 0.3s; --o: 0.12s" data-preloader-count>00</span></span>
        <sup>%</sup>
      </div>
      <span class="preloader__bar" aria-hidden="true"></span>

      <div class="preloader__foot">
        <span class="preloader__mask"><span class="preloader__label" style="--d: 0.4s; --o: 0.1s"><b data-preloader-status>Gathering the stars</b></span></span>
        <span class="preloader__mask preloader__label--hide-sm"><span class="preloader__label" style="--d: 0.5s; --o: 0.15s">Michelangelo · The Creation of Adam, c. 1512</span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
