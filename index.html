<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pérégrination — Turn a Renaissance painting into a world you can walk through, and uncover its curiosities as you go."
    />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (media swap) — keeps FCP/LCP free of a render-blocking stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- LCP hero plane — first paint of the doorway -->
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/1-far.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/6-god.webp" fetchpriority="high" />
    <title>Pérégrination — Le Voyage des Curiosités</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
