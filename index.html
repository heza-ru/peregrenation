<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pérégrination — Turn a Renaissance painting into a world you can walk through, and uncover its curiosities as you go."
    />
    <!-- Link previews (WhatsApp, iMessage, Slack). Crawlers read these from the HTML; they do not run the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pérégrination" />
    <meta property="og:url" content="https://peregrenation.vercel.app/" />
    <meta property="og:title" content="Pérégrination — Le Voyage des Curiosités" />
    <meta
      property="og:description"
      content="Step inside the paintings. Turn a Renaissance painting into a world you can walk through."
    />
    <meta property="og:image" content="https://peregrenation.vercel.app/og.jpg" />
    <meta property="og:image:secure_url" content="https://peregrenation.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="631" />
    <meta property="og:image:alt" content="Pérégrination — Adam and God reaching toward each other above a painted landscape" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pérégrination — Le Voyage des Curiosités" />
    <meta
      name="twitter:description"
      content="Step inside the paintings. Turn a Renaissance painting into a world you can walk through."
    />
    <meta name="twitter:image" content="https://peregrenation.vercel.app/og.jpg" />
    <script>
      // World routes have their own boot screen; the preloader is for `/` only.
      ;(function () {
        if (location.pathname.indexOf('/world/') === 0) return
        document.documentElement.classList.add('has-preloader', 'is-preloading')
      })()
    </script>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (media swap) — keeps FCP/LCP free of a render-blocking stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+French+Canon:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- Hero planes — URLs must match assets.parallax in src/data.ts so the cache is shared -->
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/1-far.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/6-god.webp?v=2" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/5-adam.webp?v=2" />
    <link rel="preload" as="image" type="image/webp" href="/assets/parallax/2-clouds.webp?v=2" />
    <title>Pérégrination — Le Voyage des Curiosités</title>
    <style>
      /* Critical preloader styles — inline so the loader paints before the app bundle.
         Darkness, a cartoon of construction lines converging on the gap between the
         fingers, and a point of light gathering there (drawn by the scene canvas under
         html.gl-void). Fiat lux: the light breaks and the hero burns in. */
      html.is-preloading,
      html.is-preloading body {
        overflow: hidden;
      }
      html.is-preloading .hero,
      html.is-preloading .hero * {
        animation-play-state: paused !important;
      }
      html:not(.has-preloader) #preloader {
        display: none;
      }
      @property --hole {
        syntax: '<length>';
        inherits: false;
        initial-value: -80px;
      }
      #preloader {
        --p: 0;
        --sx: 50%;
        --sy: 42%;
        --fx: 38%;
        --fy: 12vh;
        --fw: 24%;
        --fh: 72vh;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-io: cubic-bezier(0.76, 0, 0.24, 1);
        position: fixed;
        inset: 0;
        z-index: 99;
        overflow: hidden;
        color: #f2eadb;
      }
      #preloader.is-leaving {
        pointer-events: none;
      }

      /* CSS darkness until the canvas takes over, and the fallback without WebGL */
      .preloader__veil {
        --hole: -80px;
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at var(--sx) var(--sy), rgba(255, 214, 150, 0.16) 0, rgba(255, 214, 150, 0) 22vmin),
          #050407;
        transition: opacity 0.9s ease;
        -webkit-mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
        mask: radial-gradient(circle at var(--sx) var(--sy), transparent var(--hole), #000 calc(var(--hole) + 56px));
      }
      html.gl-void .preloader__veil {
        opacity: 0;
      }
      .is-leaving .preloader__veil {
        --hole: 160vmax;
        opacity: 0;
        transition:
          --hole 1.3s var(--ease-io),
          opacity 0.5s ease 0.85s;
      }
      .preloader__glow {
        position: absolute;
        left: var(--sx);
        top: var(--sy);
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff6e2;
        box-shadow: 0 0 14px 4px rgba(255, 226, 170, 0.8), 0 0 60px 18px rgba(255, 190, 110, 0.25);
        scale: calc(0.6 + var(--p) * 1.4);
      }
      html.gl-void .preloader__glow {
        display: none;
      }

      /* The cartoon: construction lines drawn in over time, the frame traced by load progress */
      .preloader__lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .preloader__lines path {
        fill: none;
        vector-effect: non-scaling-stroke;
        stroke-dasharray: 1;
        stroke-linecap: round;
        transition:
          stroke 0.5s ease,
          opacity 0.7s ease;
      }
      .preloader__lines .c {
        stroke: rgba(236, 226, 206, 0.17);
        stroke-width: 1;
        stroke-dashoffset: 1;
        animation: preloaderDraw 2.2s var(--ease-io) var(--d, 0s) forwards;
      }
      .preloader__lines .f {
        stroke: rgba(246, 238, 222, 0.85);
        stroke-width: 1.25;
        stroke-dashoffset: calc(1 - var(--p));
      }
      .is-complete .preloader__lines .c {
        stroke: rgba(243, 213, 143, 0.42);
      }
      .is-complete .preloader__lines .f {
        stroke: #f3d58f;
      }
      .is-leaving .preloader__lines path {
        opacity: 0;
        transition: opacity 0.7s ease calc(var(--d, 0s) * 0.2);
      }

      /* Type set inside the frame, like a title card on a cartoon */
      .preloader__mask {
        display: block;
        overflow: hidden;
        padding-block: 0.12em;
        margin-block: -0.12em;
      }
      .preloader__mask > * {
        display: block;
        translate: 0 110%;
        animation: preloaderLineIn 1.2s var(--ease) var(--d, 0.3s) forwards;
      }
      .is-leaving .preloader__mask > * {
        translate: 0 -110%;
        transition: translate 0.8s var(--ease-io) var(--o, 0s);
        animation: none;
      }
      .preloader__card {
        position: absolute;
        left: var(--fx);
        top: var(--fy);
        width: var(--fw);
        height: var(--fh);
        padding: clamp(0.9rem, 1.6vw, 1.25rem);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .preloader__mark {
        font-family: 'IM Fell English SC', Georgia, serif;
        font-size: 0.8125rem;
        letter-spacing: 0.24em;
        color: #c9a24a;
      }
      .preloader__title {
        margin: 0;
        font-family: 'IM Fell French Canon', Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.45rem, 2.4vw, 2.1rem);
        line-height: 1;
        color: #f7f1e4;
      }
      .preloader__title em {
        color: #e8c886;
      }
      .preloader__title-block {
        position: absolute;
        left: clamp(0.9rem, 1.6vw, 1.25rem);
        top: calc(var(--oy, 42vh) - var(--fy) + 1.5rem);
      }
      .preloader__foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
      }
      .preloader__verse {
        font-family: 'IM Fell French Canon', Georgia, serif;
        font-style: italic;
        font-size: 1rem;
        color: rgba(242, 234, 219, 0.72);
      }
      .preloader__numeral {
        font-family: 'IM Fell English SC', Georgia, serif;
        font-size: 1rem;
        letter-spacing: 0.08em;
        color: #c9a24a;
        font-variant-numeric: lining-nums;
      }

      @keyframes preloaderDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes preloaderLineIn {
        to {
          translate: 0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader__lines .c,
        .preloader__mask > * {
          animation: none !important;
          stroke-dashoffset: 0;
          translate: none;
        }
        .is-leaving .preloader__mask > * {
          translate: none;
        }
        .is-leaving .preloader__veil {
          --hole: -80px;
          transition: opacity 0.45s ease;
        }
        #preloader.is-leaving {
          opacity: 0;
          transition: opacity 0.45s ease;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Pérégrination">
      <div class="preloader__veil" aria-hidden="true"></div>
      <span class="preloader__glow" aria-hidden="true"></span>
      <svg class="preloader__lines" aria-hidden="true" data-preloader-lines></svg>
      <div class="preloader__card">
        <span class="preloader__mask"><span class="preloader__mark" style="--d: 0.5s">Pérégrination</span></span>
        <div class="preloader__title-block">
          <span class="preloader__mask"><span class="preloader__title" style="--d: 0.7s"><em>Le Voyage</em></span></span>
          <span class="preloader__mask"><span class="preloader__title" style="--d: 0.82s; --o: 0.06s">des Curiosités</span></span>
        </div>
        <div class="preloader__foot">
          <span class="preloader__mask"><span class="preloader__verse" style="--d: 1s; --o: 0.1s">Fiat lux</span></span>
          <span class="preloader__mask"><span class="preloader__numeral" style="--d: 1.1s; --o: 0.12s" data-preloader-count>I</span></span>
        </div>
      </div>
    </div>
    <script>
      // Construction lines for the current viewport, all converging on the fingertip gap.
      ;(function () {
        var root = document.getElementById('preloader')
        var svg = root && root.querySelector('[data-preloader-lines]')
        if (!svg || !document.documentElement.classList.contains('has-preloader')) return
        var PHI = 1.6180339887

        function spiral(x, y, w, n) {
          var h = w / PHI
          var d = ''
          for (var i = 0; i < n; i++) {
            var s
            switch (i % 4) {
              case 0:
                s = h
                d += 'M' + x + ' ' + y + 'h' + s + 'v' + s + 'h' + -s + 'z'
                d += 'M' + x + ' ' + (y + s) + 'A' + s + ' ' + s + ' 0 0 1 ' + (x + s) + ' ' + y
                x += s
                w -= s
                break
              case 1:
                s = w
                d += 'M' + x + ' ' + y + 'h' + s + 'v' + s + 'h' + -s + 'z'
                d += 'M' + x + ' ' + y + 'A' + s + ' ' + s + ' 0 0 1 ' + (x + s) + ' ' + (y + s)
                y += s
                h -= s
                break
              case 2:
                s = h
                d += 'M' + (x + w - s) + ' ' + y + 'h' + s + 'v' + s + 'h' + -s + 'z'
                d += 'M' + (x + w) + ' ' + y + 'A' + s + ' ' + s + ' 0 0 1 ' + (x + w - s) + ' ' + (y + s)
                w -= s
                break
              default:
                s = w
                d += 'M' + x + ' ' + (y + h - s) + 'h' + s + 'v' + s + 'h' + -s + 'z'
                d += 'M' + (x + s) + ' ' + (y + h) + 'A' + s + ' ' + s + ' 0 0 1 ' + x + ' ' + (y + h - s)
                h -= s
            }
          }
          return d
        }

        function draw() {
          if (!svg.isConnected) return window.removeEventListener('resize', draw)
          var W = window.innerWidth
          var H = window.innerHeight
          var ox = W * 0.5
          var oy = H * 0.42
          var fh = Math.min(H * 0.72, W * 0.82 * PHI)
          var fw = fh / PHI
          var fx = ox - fw / 2
          var fy = oy - fh * 0.42
          var R = H * 0.95
          var sw = fw * 0.78
          var lines = [
            'M' + ox + ' 0V' + H,
            'M0 ' + oy + 'H' + W,
            'M0 0L' + 2 * ox + ' ' + 2 * oy,
            'M' + W + ' 0L' + (2 * ox - W) + ' ' + 2 * oy,
            'M0 ' + H + 'L' + 2 * ox + ' ' + (2 * oy - H),
            'M' + W + ' ' + H + 'L' + (2 * ox - W) + ' ' + (2 * oy - H),
            'M' + (ox - R) + ' ' + (oy - R) + 'a' + R + ' ' + R + ' 0 1 0 ' + 2 * R + ' 0a' + R + ' ' + R + ' 0 1 0 ' + -2 * R + ' 0',
            'M' + (ox + R) + ' ' + (oy + R) + 'a' + R + ' ' + R + ' 0 1 0 ' + -2 * R + ' 0a' + R + ' ' + R + ' 0 1 0 ' + 2 * R + ' 0',
            'M' + fx + ' 0V' + H + 'M' + (fx + fw) + ' 0V' + H,
            'M0 ' + fy + 'H' + W + 'M0 ' + (fy + fh) + 'H' + W,
            spiral(fx - sw * 0.62, fy - (sw / PHI) * 0.38, sw, 7),
          ]
          var html = lines
            .map(function (d, i) {
              return '<path class="c" pathLength="1" style="--d:' + (0.15 + i * 0.11).toFixed(2) + 's" d="' + d + '"/>'
            })
            .join('')
          var cx = ox
          var cy = fy + fh / 2
          html +=
            '<path class="c" pathLength="1" style="--d:1.4s" transform="rotate(180 ' + cx + ' ' + cy + ')" d="' +
            spiral(fx - sw * 0.62, fy - (sw / PHI) * 0.38, sw, 7) +
            '"/>'
          // Traced from the lower left edge, clockwise, as the page loads
          html +=
            '<path class="f" pathLength="1" d="M' + fx + ' ' + (fy + fh * 0.7) + 'V' + fy + 'H' + (fx + fw) + 'V' + (fy + fh) + 'H' + fx + 'Z"/>'
          svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H)
          svg.innerHTML = html
          root.style.setProperty('--fx', fx + 'px')
          root.style.setProperty('--fy', fy + 'px')
          root.style.setProperty('--fw', fw + 'px')
          root.style.setProperty('--fh', fh + 'px')
          root.style.setProperty('--oy', oy + 'px')
        }

        draw()
        window.addEventListener('resize', draw)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
